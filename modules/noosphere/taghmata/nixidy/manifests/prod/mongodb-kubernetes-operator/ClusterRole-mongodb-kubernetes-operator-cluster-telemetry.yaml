apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mongodb-kubernetes-operator-cluster-telemetry
rules:
  - nonResourceURLs:
      - /version
    verbs:
      - get
  - apiGroups:
      - ""
    resourceNames:
      - kube-system
    resources:
      - namespaces
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - list
