apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pg-forgejo-scheduled-backup
  namespace: forgejo
spec:
  backupOwnerReference: self
  cluster:
    name: pg-forgejo
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  schedule: 0 2 0 * * *
