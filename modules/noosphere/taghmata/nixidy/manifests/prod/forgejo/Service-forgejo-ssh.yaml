apiVersion: v1
kind: Service
metadata:
  annotations:
    metallb.io/allow-shared-ip: noosphere
    metallb.io/loadBalancerIPs: 192.168.1.240
  labels:
    app: forgejo
    app.kubernetes.io/instance: forgejo
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/version: 13.0.4
    helm.sh/chart: forgejo-15.0.4
    version: 13.0.4
  name: forgejo-ssh
  namespace: forgejo
spec:
  ports:
    - name: ssh
      port: 22
      protocol: TCP
      targetPort: ssh
  selector:
    app.kubernetes.io/instance: forgejo
    app.kubernetes.io/name: forgejo
  type: LoadBalancer
