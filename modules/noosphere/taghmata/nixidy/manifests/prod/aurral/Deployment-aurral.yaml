apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: aurral
  name: aurral
  namespace: yarr
spec:
  selector:
    matchLabels:
      app: aurral
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: aurral
    spec:
      containers:
        - env:
            - name: PUID
              value: "1031"
            - name: PGID
              value: "65537"
            - name: LIBRARY_FOLDER
              value: /data/media/aurral
            - name: FILE_BROWSE_ROOTS
              value: /data/media
            - name: AURRAL_PUBLIC_URL
              value: https://aurral.noosphere.uk
            - name: OIDC_ENABLED
              value: "true"
            - name: OIDC_ISSUER
              value: https://id.noosphere.uk
            - name: OIDC_REDIRECT_URI
              value: https://aurral.noosphere.uk/sso/callback
            - name: OIDC_SCOPES
              value: openid profile email groups
            - name: OIDC_GROUPS_CLAIM
              value: groups
            - name: OIDC_ADMIN_GROUPS
              value: Admin
          envFrom:
            - secretRef:
                name: aurral-oidc
          image: ghcr.io/lklynet/aurral:latest
          name: aurral
          ports:
            - containerPort: 3001
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /data
              name: data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: aurral-config
        - name: data
          nfs:
            path: /volume1/data/
            server: 192.168.1.61
