apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    argocd.proj.io/sync-hook: PreSync
    argocd.proj.io/sync-options: Prune=false,Delete=false
  name: pg-woodpecker-rev-1
  namespace: woodpecker
spec:
  backup:
    retentionPolicy: 30d
    target: prefer-standby
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-minimal-trixie
  instances: 3
  monitoring:
    enablePodMonitor: true
  plugins:
    - isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: woodpecker-object-store
  postgresql:
    parameters:
      log_statement: ddl
      max_connections: "200"
      shared_buffers: 1GB
  primaryUpdateStrategy: unsupervised
  storage:
    size: 20Gi
    storageClass: longhorn-cnpg-strict-local
  walStorage:
    size: 50Gi
    storageClass: longhorn-cnpg-strict-local
