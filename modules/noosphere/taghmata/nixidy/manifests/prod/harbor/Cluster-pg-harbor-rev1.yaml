apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    release: kube-prometheus-stack
  name: pg-harbor-rev1
  namespace: harbor
spec:
  backup:
    retentionPolicy: 30d
    target: prefer-standby
  bootstrap:
    recovery:
      recoveryTarget:
        backupID: 20260924T000203
        targetTime: 2026-09-24 16:35:00+00
      source: origin
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: harbor-object-store
          serverName: pg-harbor-rev1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-minimal-trixie
  instances: 3
  managed:
    roles:
      - comment: Harbor User
        ensure: present
        login: true
        name: harbor
        passwordSecret:
          name: pg-harbor-postgres-secret
        superuser: false
  monitoring:
    customQueriesConfigMap:
      - key: queries
        name: cnpg-default-monitoring
    enablePodMonitor: true
    podMonitorMetricRelabelings:
      - action: replace
        sourceLabels:
          - cluster
        targetLabel: cnpg_cluster
    podMonitorRelabelings:
      - action: replace
        sourceLabels:
          - __meta_kubernetes_pod_name
        targetLabel: pod
  plugins:
    - isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: harbor-object-store
  postgresql:
    parameters:
      log_statement: ddl
      max_connections: "200"
      shared_buffers: 1GB
  primaryUpdateStrategy: unsupervised
  storage:
    size: 20Gi
    storageClass: longhorn-cnpg-strict-local
  walStorage:
    size: 20Gi
    storageClass: longhorn-cnpg-strict-local
