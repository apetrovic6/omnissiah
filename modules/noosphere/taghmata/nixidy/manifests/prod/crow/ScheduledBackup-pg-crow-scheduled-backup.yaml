apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pg-crow-scheduled-backup
  namespace: crow
spec:
  backupOwnerReference: self
  cluster:
    name: pg-crow
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  schedule: 0 2 0 * * *
