apiVersion: garage.rajsingh.info/v1alpha1
kind: GarageCluster
metadata:
  name: garage-backup
  namespace: garage-operator
spec:
  admin:
    adminTokenSecretRef:
      key: admin-token
      name: garage-backup-admin-token
    bindPort: 3903
    enabled: true
  database:
    engine: sqlite
  discovery:
    kubernetes:
      enabled: true
  layoutManagement:
    autoApply: true
    minNodesHealthy: 2
  layoutPolicy: Auto
  network:
    rpcBindPort: 3901
    rpcSecretRef:
      key: rpc-secret
      name: garage-backup-rpc-secret
    service:
      type: ClusterIP
  replicas: 3
  replication:
    factor: 3
  s3Api:
    bindPort: 3900
    region: backup
    rootDomain: .s3.backup.garage.noosphere.uk
  storage:
    data:
      size: 300Gi
      storageClassName: synology-nfs
    metadata:
      size: 20Gi
      storageClassName: synology-nfs
  zone: main
