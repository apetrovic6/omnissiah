apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/name: garage-block-census
    garage-monitoring/cluster: garage-main
  name: garage-main-block-census
  namespace: garage-operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: garage-block-census
      garage-monitoring/cluster: garage-main
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage-block-census
        garage-monitoring/cluster: garage-main
    spec:
      automountServiceAccountToken: false
      containers:
        - command:
            - sh
            - /scripts/block-census.sh
          env:
            - name: ROOT
              value: /census
            - name: GLOB
              value: '*_data-garage-main-*'
            - name: OUT
              value: /www
            - name: INTERVAL
              value: "900"
          image: docker.io/library/busybox:1.37.0
          name: census
          ports:
            - containerPort: 9101
              name: metrics
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /census
              name: census
              readOnly: true
            - mountPath: /scripts
              name: scripts
              readOnly: true
            - mountPath: /www
              name: www
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - hostPath:
            path: /mnt/storage/garage
            type: Directory
          name: census
        - configMap:
            name: block-census
          name: scripts
        - emptyDir:
            sizeLimit: 16Mi
          name: www
