        namespace: garage-operator
        path: /validate-garage-rajsingh-info-v1beta1-garagecluster
    failurePolicy: Fail
    name: vgarageclusterv1beta1.kb.io
    rules:
      - apiGroups:
          - garage.rajsingh.info
        apiVersions:
          - v1beta1
