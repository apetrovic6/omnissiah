          - garage.rajsingh.info
        apiVersions:
          - v1beta1
        operations:
          - CREATE
          - UPDATE
        resources:
          - garagebuckets
    sideEffects: None
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: garage-operator-webhook
        namespace: garage-operator
        path: /validate-garage-rajsingh-info-v1beta2-garagecluster
    failurePolicy: Fail
    name: vgaragecluster.kb.io
    rules:
