apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: garage-operator/garage-operator-webhook-cert
  labels:
    app.kubernetes.io/instance: garage-operator
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: garage-operator
    app.kubernetes.io/version: 0.6.23
    control-plane: controller-manager
    helm.sh/chart: garage-operator-0.6.23
  name: garage-operator-validating
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: garage-operator-webhook
        namespace: garage-operator
        path: /validate-garage-rajsingh-info-v1beta1-garageadmintoken
    failurePolicy: Fail
    name: vgarageadmintoken.kb.io
    rules:
      - apiGroups:
          - garage.rajsingh.info
        apiVersions:
          - v1beta1
        operations:
          - CREATE
          - UPDATE
        resources:
          - garageadmintokens
    sideEffects: None
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: garage-operator-webhook
        namespace: garage-operator
        path: /validate-garage-rajsingh-info-v1beta1-garagebucket
