    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              garage.rajsingh.info/cluster: garage-backup
              garage.rajsingh.info/tier: storage
          topologyKey: kubernetes.io/hostname
  capacity: 300Gi
  clusterRef:
    name: garage-backup
  gateway: false
  nodeId: 89ecc25cb9e15ebbba8989a48cb0a213f2476c21d9ba87b72de02879cd277714
  storage:
    data:
      existingClaim: data-garage-backup-0
    metadata:
      existingClaim: metadata-garage-backup-0
  tags:
    - garage-backup-storage-0-0
  zone: main
