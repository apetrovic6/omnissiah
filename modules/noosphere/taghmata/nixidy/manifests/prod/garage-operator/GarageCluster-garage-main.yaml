apiVersion: garage.rajsingh.info/v1beta2
kind: GarageCluster
metadata:
  name: garage-main
  namespace: garage-operator
spec:
  admin:
    adminTokenSecretRef:
      key: admin-token
      name: garage-main-admin-token
    bindPort: 3903
  database:
    engine: sqlite
  discovery:
    kubernetes:
      enabled: false
  layoutManagement:
    autoApply: true
    minNodesHealthy: 2
  layoutPolicy: Auto
  network:
    rpcBindPort: 3901
    rpcSecretRef:
      key: rpc-secret
      name: garage-main-rpc-secret
    service:
      type: ClusterIP
  replication:
    factor: 3
  s3Api:
    bindPort: 3900
    region: main
    rootDomain: .s3.main.garage.noosphere.uk
  storage:
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                garage.rajsingh.info/cluster: garage-main
                garage.rajsingh.info/tier: storage
            topologyKey: kubernetes.io/hostname
    data:
      size: 200Gi
      storageClassName: local-path
    metadata:
      size: 10Gi
      storageClassName: local-path
    replicas: 3
  zone: main
