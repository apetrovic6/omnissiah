apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pg-zitadel-scheduled-backup
  namespace: zitadel
spec:
  backupOwnerReference: self
  cluster:
    name: pg-zitadel
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  schedule: 0 2 0 * * *
