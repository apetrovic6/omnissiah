apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/instance: dagger
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: dagger-helm
    app.kubernetes.io/part-of: dagger-helm
    app.kubernetes.io/version: v0.21.3
    helm.sh/chart: dagger-helm-0.21.3
  name: dagger-dagger-helm-engine
  namespace: dagger
spec:
  selector:
    matchLabels:
      name: dagger-dagger-helm-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: dagger
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: dagger-helm
        app.kubernetes.io/part-of: dagger-helm
        app.kubernetes.io/version: v0.21.3
        helm.sh/chart: dagger-helm-0.21.3
        name: dagger-dagger-helm-engine
    spec:
      containers:
        - image: registry.dagger.io/engine:v0.21.3
          imagePullPolicy: IfNotPresent
          livenessProbe:
            exec:
              command:
                - sh
                - -exc
                - dagger core version
            failureThreshold: 20
            initialDelaySeconds: 5
            periodSeconds: 30
            successThreshold: 1
            terminationGracePeriodSeconds: 30
            timeoutSeconds: 29
          name: dagger-engine
          readinessProbe:
            exec:
              command:
                - sh
                - -exc
                - dagger core version
            failureThreshold: 10
            initialDelaySeconds: 5
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 14
          resources:
            limits: {}
            requests: {}
          securityContext:
            capabilities:
              add:
                - ALL
            privileged: true
          volumeMounts:
            - mountPath: /var/lib/dagger
              name: varlibdagger
            - mountPath: /run/dagger
              name: varrundagger
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1001
        runAsUser: 0
      serviceAccountName: default
      terminationGracePeriodSeconds: 300
      volumes:
        - hostPath:
            path: /var/lib/dagger-dagger-dagger-helm
          name: varlibdagger
        - hostPath:
            path: /run/dagger-dagger-dagger-helm
          name: varrundagger
