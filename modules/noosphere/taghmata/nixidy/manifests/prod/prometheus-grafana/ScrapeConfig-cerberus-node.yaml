apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  labels:
    release: kube-prometheus-stack
  name: cerberus-node
  namespace: observability
spec:
  jobName: cerberus-node
  metricsPath: /metrics
  relabelings:
    - action: replace
      regex: .*
      replacement: cerberus
      sourceLabels:
        - __address__
      targetLabel: instance
  scheme: http
  scrapeInterval: 30s
  scrapeTimeout: 10s
  staticConfigs:
    - labels:
        host: cerberus
      targets:
        - 192.168.1.105:9100
