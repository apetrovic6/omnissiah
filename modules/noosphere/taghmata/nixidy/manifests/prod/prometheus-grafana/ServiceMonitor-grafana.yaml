apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/name: grafana
    app.kubernetes.io/version: 13.1.0
    helm.sh/chart: grafana-12.7.1
    release: kube-prometheus-stack
  name: grafana
  namespace: observability
spec:
  endpoints:
    - honorLabels: true
      path: /metrics
      port: http-web
      scheme: http
  jobLabel: kube-prometheus-stack
  namespaceSelector:
    matchNames:
      - observability
  selector:
    matchLabels:
      app.kubernetes.io/instance: kube-prometheus-stack
      app.kubernetes.io/name: grafana
