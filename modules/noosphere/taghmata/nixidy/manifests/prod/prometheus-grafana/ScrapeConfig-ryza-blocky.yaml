apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  labels:
    release: kube-prometheus-stack
  name: ryza-blocky
  namespace: observability
spec:
  jobName: ryza-blocky
  metricsPath: /metrics
  relabelings:
    - action: replace
      regex: .*
      replacement: ryza
      sourceLabels:
        - __address__
      targetLabel: instance
  scheme: http
  scrapeInterval: 30s
  scrapeTimeout: 10s
  staticConfigs:
    - labels:
        host: ryza
      targets:
        - 192.168.1.45:4001
