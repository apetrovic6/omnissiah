apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    app: kube-prometheus-stack-admission-create
    app.kubernetes.io/component: prometheus-operator-webhook
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator
    app.kubernetes.io/part-of: kube-prometheus-stack
    app.kubernetes.io/version: 93.2.2
    chart: kube-prometheus-stack-93.2.2
    heritage: Helm
    release: kube-prometheus-stack
  name: prometheus-admission-create
  namespace: observability
spec:
  template:
    metadata:
      labels:
        app: kube-prometheus-stack-admission-create
        app.kubernetes.io/component: prometheus-operator-webhook
        app.kubernetes.io/instance: kube-prometheus-stack
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator
        app.kubernetes.io/part-of: kube-prometheus-stack
        app.kubernetes.io/version: 93.2.2
        chart: kube-prometheus-stack-93.2.2
        heritage: Helm
        release: kube-prometheus-stack
      name: prometheus-admission-create
    spec:
      containers:
        - args:
            - create
            - --host=prometheus-operator,prometheus-operator.observability.svc
            - --namespace=observability
            - --secret-name=prometheus-admission
            - --secret-type=kubernetes.io/tls
          image: ghcr.io/jkroepke/kube-webhook-certgen:1.11.1
          imagePullPolicy: IfNotPresent
          name: create
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      nodeSelector:
        kubernetes.io/os: linux
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 2000
        runAsNonRoot: true
        runAsUser: 2000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: prometheus-admission
  ttlSecondsAfterFinished: 60
