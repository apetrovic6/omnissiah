apiVersion: v1
data:
  init-config.sh: |
    #!/bin/sh
    INI=/config/sabnzbd.ini
    if [ ! -f "$INI" ]; then
      echo "sabnzbd.ini not found, skipping patch"
      exit 0
    fi
    if grep -q '^host_whitelist' "$INI"; then
      sed -i "s|^host_whitelist.*|host_whitelist = sab.noosphere.uk|" "$INI"
    else
      sed -i '/^\[misc\]/a host_whitelist = sab.noosphere.uk' "$INI"
    fi
    echo "host_whitelist patched"
kind: ConfigMap
metadata:
  name: sabnzbd-init
  namespace: yarr
