apiVersion: v1
kind: Service
metadata:
  annotations:
    metallb.universe.tf/allow-shared-ip: unifi-controller
  name: unifi-devices
  namespace: unifi-controller
spec:
  loadBalancerIP: 192.168.1.240
  ports:
    - name: stun
      port: 3478
      protocol: UDP
      targetPort: 3478
    - name: discovery
      port: 10001
      protocol: UDP
      targetPort: 10001
  selector:
    app: unifi-controller
  type: LoadBalancer
