apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: unifi-mongodb
  namespace: unifi
spec:
  crVersion: 1.18.0
  enableVolumeExpansion: true
  image: percona/percona-server-mongodb:8.0.17-6
  replsets:
    - affinity:
        antiAffinityTopologyKey: kubernetes.io/hostname
      name: rs0
      podDisruptionBudget:
        maxUnavailable: 1
      resources:
        limits:
          cpu: 1000m
          memory: 2Gi
        requests:
          cpu: 100m
          memory: 512Mi
      size: 3
      volumeSpec:
        persistentVolumeClaim:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
          storageClassName: longhorn
  secrets:
    users: unifi-mongodb-password
  tls:
    mode: allowTLS
  users:
    - db: admin
      name: unifi
      passwordSecretRef:
        key: unifi
        name: unifi-mongodb-password
      roles:
        - db: unifi
          name: dbAdmin
        - db: unifi_audit
          name: dbAdmin
        - db: unifi_stat
          name: dbAdmin
        - db: unifi
          name: readWrite
        - db: unifi_audit
          name: readWrite
        - db: unifi_stat
          name: readWrite
