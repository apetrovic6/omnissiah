apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pg-pilot-scheduled-backup-0
  namespace: pilot
spec:
  backupOwnerReference: self
  cluster:
    name: pg-pilot
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  schedule: 0 30 2 * * *
