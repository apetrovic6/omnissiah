apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
spec:
  db:
    database: app
    host: pg-keycloak-rw
    passwordSecret:
      key: password
      name: pg-keycloak-app
    port: 5432
    usernameSecret:
      key: username
      name: pg-keycloak-app
    vendor: postgres
  hostname:
    hostname: keycloak.noosphere.uk
  http:
    httpEnabled: true
  ingress:
    annotations:
      category: security
      glance/description: Identity Provider
      glance/icon: di:keycloak
      glance/id: keycloak
      glance/name: Keycloak
      glance/parent: keycloak
      glance/url: https://keycloak.noosphere.uk
    className: traefik
    enabled: true
    tlsSecret: keycloak-tls
  instances: 3
  proxy:
    headers: xforwarded
