apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    category: utils
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    glance/description: Always-on agent on ryza
    glance/icon: di:openai
    glance/name: Hermes
    glance/url: https://hermes.noosphere.uk
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  name: hermes
  namespace: hermes
spec:
  ingressClassName: traefik
  rules:
    - host: hermes.noosphere.uk
      http:
        paths:
          - backend:
              service:
                name: hermes
                port:
                  number: 9119
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - hermes.noosphere.uk
      secretName: hermes-tls
