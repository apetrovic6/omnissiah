apiVersion: v1
data:
  config.yaml: |
    # ncps configuration
    analytics:
      reporting:
        enabled: true

    cache:
      hostname: "ncps.noosphere.uk"
      max-size: "250G"
      download:
        poll-timeout: "30s"
      temp-path: "/tmp/ncps"

      sign-narinfo: true

      upstream:
        urls:
          - "https://cache.nixos.org"
        public-keys:
          - "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY="
        dialer-timeout: "3s"
        response-header-timeout: "3s"

      storage:
        s3:
          bucket: "ncps"
          endpoint: "http://garage-s3-api.garage-operator.svc.cluster.local:3900"
          region: "main"
          force-path-style: true

      lock:
        backend: "local"
        redis:
          key-prefix: "ncps:lock:"
        download-lock-ttl: "5m"
        lru-lock-ttl: "30m"
        retry:
          max-attempts: 3
          initial-delay: "100ms"
          max-delay: "2s"
          jitter: true

    server:
      addr: ":8501"

    log:
      level: "info"
    opentelemetry:
      enabled: true
      grpc-url: ""
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: ncps
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ncps
    app.kubernetes.io/version: v0.9.4
    helm.sh/chart: ncps-v0.9.4
  name: ncps
  namespace: ncps
