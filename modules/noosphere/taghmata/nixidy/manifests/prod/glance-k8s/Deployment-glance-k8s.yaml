apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: glance-k8s
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: glance-k8s
    app.kubernetes.io/version: v0.0.0
    helm.sh/chart: glance-k8s-v0.0.0
  name: glance-k8s
  namespace: glance
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: glance-k8s
      app.kubernetes.io/name: glance-k8s
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: glance-k8s
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: glance-k8s
        app.kubernetes.io/version: v0.0.0
        helm.sh/chart: glance-k8s-v0.0.0
    spec:
      containers:
        - image: ghcr.io/lukasdietrich/glance-k8s/glance-k8s:v0.4.3
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          name: glance-k8s
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
      securityContext:
        fsGroup: 2000
      serviceAccountName: glance-k8s
