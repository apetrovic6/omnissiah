apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/instance: glance-k8s
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: glance-k8s
    app.kubernetes.io/version: v0.0.0
    helm.sh/chart: glance-k8s-v0.0.0
  name: glance-k8s
rules:
  - apiGroups:
      - ""
      - metrics.k8s.io
    resources:
      - nodes
    verbs:
      - list
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - list
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - list
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - list
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
      - daemonsets
    verbs:
      - list
