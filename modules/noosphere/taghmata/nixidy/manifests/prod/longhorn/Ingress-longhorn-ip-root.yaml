apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    category: storage
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    glance/description: Distributed network storage
    glance/icon: di:longhorn
    glance/id: longhorn
    glance/name: Longhorn
    glance/parent: longhorn
    glance/url: https://longhorn.noosphere.uk
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  name: longhorn-ip-root
  namespace: longhorn-system
spec:
  ingressClassName: traefik
  rules:
    - host: longhorn.noosphere.uk
      http:
        paths:
          - backend:
              service:
                name: longhorn-frontend
                port:
                  number: 80
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - longhorn.noosphere.uk
      secretName: longhorn-tls
